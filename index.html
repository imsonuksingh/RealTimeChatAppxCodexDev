<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodexDev Chat App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            height: 100%;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Existing styles remain unchanged */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .home-page {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .greeting {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out forwards;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 15px 40px;
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        /* New social login buttons */
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: white;
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .social-btn i {
            margin-right: 10px;
            font-size: 1.2em;
        }

        .phone-btn {
            background: linear-gradient(45deg, #25D366, #128C7E);
        }

        .facebook-btn {
            background: linear-gradient(45deg, #3b5998, #4267B2);
        }

        .twitter-btn {
            background: linear-gradient(45deg, #1DA1F2, #1DA1F2);
        }

        .email-password-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }

        .or-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.7);
        }

        .or-divider::before,
        .or-divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .or-divider::before {
            margin-right: 15px;
        }

        .or-divider::after {
            margin-left: 15px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
            color: #4ecdc4;
        }

        .modal-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .modal-btn.primary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }

        .modal-btn.secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
        }

        .error-message {
            color: #ff6b6b;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .success-message {
            color: #4ecdc4;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            margin: 0 auto;
            padding: 15px;
        }

        .chat-container.show {
            display: flex !important;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 15px 15px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chat-title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            border: none;
            padding: 8px 15px;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(0.8rem, 2vw, 1rem);
        }

        .logout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .messages-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 180px);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 85%;
            word-wrap: break-word;
            animation: messageSlideIn 0.3s ease-out;
            position: relative;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            background: linear-gradient(45deg, #667eea, #764ba2);
            margin-left: auto;
            text-align: right;
        }

        .message.other {
            background: rgba(255, 255, 255, 0.1);
            margin-right: auto;
        }

        .message.deleted {
            opacity: 0.5;
            font-style: italic;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .message.edited::after {
            content: " (edited)";
            font-size: 0.7rem;
            opacity: 0.7;
            font-style: italic;
        }

        .message-info {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .message-text {
            font-size: clamp(0.9rem, 2vw, 1rem);
            line-height: 1.4;
        }

        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .message-image:hover {
            transform: scale(1.05);
        }

        .message-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
            gap: 5px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.7);
            border: none;
            padding: 4px 8px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
        }

        .edit-btn {
            background: rgba(78, 205, 196, 0.8);
        }

        .delete-btn {
            background: rgba(255, 107, 107, 0.8);
        }

        .input-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 0 0 15px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .edit-mode-indicator {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
        }

        .edit-mode-indicator.show {
            display: block;
        }

        .message-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 15px;
            border-radius: 25px;
            color: white;
            font-size: clamp(0.9rem, 2vw, 1rem);
            outline: none;
            transition: all 0.3s ease;
            resize: none;
            max-height: 120px;
            min-height: 45px;
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .input-buttons {
            display: flex;
            gap: 5px;
            align-items: flex-end;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input {
            display: none;
        }

        .file-btn, .send-btn, .cancel-edit-btn {
            border: none;
            padding: 12px 15px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1rem);
            white-space: nowrap;
            min-width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .send-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .cancel-edit-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            display: none;
        }

        .cancel-edit-btn.show {
            display: flex;
        }

        .file-btn:hover, .send-btn:hover, .cancel-edit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* Debug Panel */
        .debug-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 1000;
            display: none;
            width: 90%;
            max-height: 80vh;
            overflow: auto;
        }

        .debug-panel.show {
            display: block;
        }

        .debug-toggle {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            z-index: 1001;
            font-size: 12px;
        }

        #user-email {
            font-size: clamp(0.8rem, 2vw, 1rem);
            word-break: break-all;
        }

        /* New user notification */
        .user-joined-notification {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
            padding: 10px 15px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
            font-style: italic;
            border: 1px solid rgba(78, 205, 196, 0.3);
            animation: messageSlideIn 0.3s ease-out;
        }

        /* Image modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            z-index: 2001;
        }

        @media (max-width: 480px) {
            .home-page {
                padding: 25px 15px;
            }
            
            .message {
                max-width: 90%;
                padding: 8px 12px;
            }
            
            .input-container {
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }
            
            .input-wrapper {
                width: 100%;
            }
            
            .input-buttons {
                justify-content: center;
                width: 100%;
            }
            
            .message-input {
                padding: 10px 12px;
            }
            
            .file-btn, .send-btn, .cancel-edit-btn {
                padding: 10px 12px;
                min-width: 40px;
                height: 40px;
            }
            
            .chat-header {
                padding: 10px;
            }
            
            .messages-container {
                padding: 10px;
            }
            
            .login-btn {
                padding: 12px 20px;
            }

            .message-image {
                max-width: 200px;
                max-height: 200px;
            }
        }

        @media (max-height: 600px) {
            .home-page {
                padding: 20px;
            }
            
            .title {
                margin-bottom: 15px;
            }
            
            .greeting {
                margin-bottom: 20px;
            }
        }
    
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overscroll-behavior: none;
}

body {
    display: flex;
    flex-direction: column;
}

.chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.messages-container {
    flex: 1;
    overflow-y: auto;
}
</style>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <!-- Debug Panel -->
    <button class="debug-toggle" onclick="toggleDebug()">Debug</button>
    <div id="debug-panel" class="debug-panel">
        <div id="debug-content">Loading debug info...</div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="image-modal" onclick="closeImageModal()">
        <span class="image-modal-close">&times;</span>
        <img id="modal-image" src="" alt="Full size image">
    </div>

    <!-- Home Page -->
    <div id="home-page" class="container">
        <div class="home-page">
            <h1 class="title">Welcome To CodexDev Chat App</h1>
            <p id="greeting" class="greeting">Loading amazing greetings...</p>
            <button class="login-btn" onclick="loginWithEmail()">
                🚀 Login With Email Link
            </button>

            <div class="or-divider">OR</div>

            <div class="login-options">
                <button class="social-btn phone-btn" onclick="showPhoneLogin()">
                    <i class="fas fa-mobile-alt"></i> Sign in with Phone
                </button>
                <button class="social-btn facebook-btn" onclick="loginWithFacebook()">
                    <i class="fab fa-facebook-f"></i> Sign in with Facebook
                </button>
                <button class="social-btn twitter-btn" onclick="loginWithTwitter()">
                    <i class="fab fa-twitter"></i> Sign in with Twitter
                </button>
                <button class="social-btn email-password-btn" onclick="showEmailPasswordLogin()">
                    <i class="fas fa-envelope"></i> Sign in with Email/Password
                </button>
            </div>
        </div>
    </div>

    <!-- Phone Login Modal -->
    <div id="phone-login-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('phone-login-modal')">&times;</span>
            <h2 class="modal-title">Phone Sign In</h2>
            <div id="phone-error" class="error-message"></div>
            <div id="phone-success" class="success-message"></div>
            <input type="tel" id="phone-number" class="modal-input" placeholder="Phone number (e.g. +1234567890)">
            <div id="recaptcha-container"></div>
            <button id="send-otp-btn" class="modal-btn primary" onclick="sendOTP()">Send Verification Code</button>
            <div id="verify-otp-section" style="display: none;">
                <input type="text" id="verification-code" class="modal-input" placeholder="Enter verification code">
                <button class="modal-btn primary" onclick="verifyOTP()">Verify Code</button>
            </div>
            <button class="modal-btn secondary" onclick="closeModal('phone-login-modal')">Cancel</button>
        </div>
    </div>

    <!-- Email/Password Login Modal -->
    <div id="email-password-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('email-password-modal')">&times;</span>
            <h2 class="modal-title" id="email-password-modal-title">Sign In</h2>
            <div id="email-password-error" class="error-message"></div>
            <div id="email-password-success" class="success-message"></div>
            <input type="email" id="login-email" class="modal-input" placeholder="Email address">
            <input type="password" id="login-password" class="modal-input" placeholder="Password">
            <button id="email-password-action-btn" class="modal-btn primary" onclick="handleEmailPasswordAuth()">Sign In</button>
            <button class="modal-btn secondary" onclick="toggleSignUpSignIn()" id="toggle-auth-mode">Create New Account</button>
            <button class="modal-btn secondary" onclick="closeModal('email-password-modal')">Cancel</button>
        </div>
    </div>

    <!-- Chat Page -->
    <div id="chat-page" class="chat-container">
        <div class="chat-header">
            <div class="chat-title">CodexDev Chat Room</div>
            <div>
                <span id="user-email" style="margin-right: 15px; opacity: 0.8;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <div id="messages-container" class="messages-container"></div>
        <div class="input-container">
            <div class="input-wrapper">
                <div id="edit-mode-indicator" class="edit-mode-indicator">
                    Editing message... <span id="cancel-edit-text" onclick="cancelEdit()" style="cursor: pointer; text-decoration: underline;">Cancel</span>
                </div>
                <textarea 
                    id="message-input" 
                    class="message-input" 
                    placeholder="Type your message here..." 
                    onkeypress="handleKeyPress(event)"
                    rows="1"
                ></textarea>
            </div>
            <div class="input-buttons">
                <div class="file-input-wrapper">
                    <input type="file" id="file-input" class="file-input" accept="image/*" onchange="handleFileSelect(event)">
                    <button class="file-btn" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-image"></i>
                    </button>
                </div>
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
                <button id="cancel-edit-btn" class="cancel-edit-btn" onclick="cancelEdit()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <script>

        // Particle System
        class ParticleSystem {
            constructor() {
                this.canvas = document.getElementById('particles-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
                
                this.resize();
                this.init();
                this.animate();
                
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                const numParticles = Math.min(100, Math.floor((this.canvas.width * this.canvas.height) / 15000));
                
                for (let i = 0; i < numParticles; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        radius: Math.random() * 3 + 1,
                        color: this.colors[Math.floor(Math.random() * this.colors.length)],
                        alpha: Math.random() * 0.8 + 0.2
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    if (particle.x < 0 || particle.x > this.canvas.width) particle.vx *= -1;
                    if (particle.y < 0 || particle.y > this.canvas.height) particle.vy *= -1;
                    
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.fill();
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowColor = particle.color;
                    this.ctx.restore();
                });
                
                // Draw connections
                this.particles.forEach((particle, i) => {
                    this.particles.slice(i + 1).forEach(otherParticle => {
                        const dx = particle.x - otherParticle.x;
                        const dy = particle.y - otherParticle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 150) {
                            this.ctx.save();
                            this.ctx.globalAlpha = (150 - distance) / 150 * 0.3;
                            this.ctx.beginPath();
                            this.ctx.moveTo(particle.x, particle.y);
                            this.ctx.lineTo(otherParticle.x, otherParticle.y);
                            this.ctx.strokeStyle = '#ffffff';
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                            this.ctx.restore();
                        }
                    });
                });
                
                requestAnimationFrame(() => this.animate());
            }
        }

                            }
                        });
                        
                        messagesRef.on('child_removed', (snapshot) => {
                            const messageKey = snapshot.key;
                            const messageElement = document.getElementById(`message-${messageKey}`);
                            if (messageElement) {
                                messageElement.remove();
                            }
                        });
                        
                        console.log('✅ Real-time messaging setup complete (private mode)');
                    } catch (error) {
                        console.error('❌ Error setting up real-time messaging:', error);
                    }
                    
                } else {
                    console.log('❌ No user signed in');
                    currentUser = null;
                    userJoinTime = null;
                    editingMessageId = null;
                    
                    // Show home page and hide chat page
                    const homePage = document.getElementById('home-page');
                    const chatPage = document.getElementById('chat-page');
                    
                    if (homePage && chatPage) {
                        homePage.classList.remove('hidden');
                        chatPage.classList.add('hidden');
                        console.log('✅ Switched back to home page');
                    }
                    
                    if (messagesRef) {
                        messagesRef.off();
                        messagesRef = null;
                    }
                }
            });
        });
    </script>

<!-- Anti‑inspect / anti‑copy protection  -->
<script>
/* === SETTINGS ================================================ */
const PROTECTION_ENABLED = true;      // set false while you're debugging
const WARNING_DURATION   = 2000;      // ms the overlay stays visible
/* ============================================================== */

if (PROTECTION_ENABLED) {
  // CREATE THE OVERLAY JUST ONCE
  const warn = document.createElement('div');
  warn.id = 'anti‑inspect‑overlay';
  warn.innerHTML = '<span>⚠️ ACCESS DENIED ⚠️</span>';
  document.body.appendChild(warn);

  /* ---------- BLOCK RIGHT‑CLICK & TOUCH‑HOLD ---------- */
  window.addEventListener('contextmenu', e => { e.preventDefault(); flash(); });

  /* ---------- BLOCK KEY COMBOS ---------- */
  window.addEventListener('keydown', e => {
    const k = e.key, c = e.code, ctrl = e.ctrlKey, shift = e.shiftKey;
    // F12 or ⇧⌘I / Ctrl‑Shift‑I/J/C or Ctrl‑U
    if (
      c === 'F12' ||
      (ctrl && shift && ['I','J','C'].includes(k.toUpperCase())) ||
      (ctrl && k.toUpperCase() === 'U')
    ) {
      e.preventDefault(); flash();
    }
  }, { capture: true });

  /* ---------- HELPER: SHOW / HIDE OVERLAY ---------- */
  let hideTimer;
  function flash() {
    clearTimeout(hideTimer);
    warn.classList.add('show');
    hideTimer = setTimeout(() => warn.classList.remove('show'), WARNING_DURATION);
  }
}

/* === STYLES (inserted dynamically so you don't have to open <style>) */
const css = `
  #anti\u2011inspect\u2011overlay {
    position: fixed; inset: 0;                /* full‑screen */
    display: flex; justify-content: center; align-items: center;
    backdrop-filter: blur(6px);
    background: rgba(0,0,0,0.85);
    z-index: 2000; opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 2px; font-weight: 700;
  }
  #anti\u2011inspect\u2011overlay.show { opacity: 1; pointer-events: all; }
  #anti\u2011inspect\u2011overlay span{
    background: linear-gradient(45deg,#ff6b6b,#4ecdc4);
    -webkit-background-clip:text; background-clip:text;
    color: transparent; text-shadow: 0 0 30px rgba(255,255,255,.5);
    animation: pulse .8s ease-in-out infinite alternate;
  }
  @keyframes pulse { from{transform:scale(.95)} to{transform:scale(1)} }
`;
const style = document.createElement('style');
style.appendChild(document.createTextNode(css));
document.head.appendChild(style);
</script>
